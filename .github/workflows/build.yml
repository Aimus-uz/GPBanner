name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build GPBanner.csproj -c Release -o out

      - name: Package
        run: |
          mkdir -p package/addons/counterstrikesharp/plugins/GPBanner
          cp out/GPBanner.dll package/addons/counterstrikesharp/plugins/GPBanner/
          cd package && zip -r ../GPBanner.zip addons

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPBanner
          path: package/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GPBanner.zip
